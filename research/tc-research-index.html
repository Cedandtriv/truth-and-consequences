<html lang="en">

<!-- Theme init: runs before anything renders to prevent flash -->
<script>
(function(){
  var s=localStorage.getItem('tc-theme');
  var d=s?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(d){document.documentElement.classList.add('dark');}
  else{document.documentElement.classList.add('light');}
  // Intercept matchMedia so React initialises with the correct theme
  if(s){
    var _orig=window.matchMedia.bind(window);
    window.matchMedia=function(q){
      if(q==='(prefers-color-scheme: dark)'){
        var fake={matches:s==='dark',media:q,onchange:null,addEventListener:function(){},removeEventListener:function(){},dispatchEvent:function(){return false;}};
        return fake;
      }
      return _orig(q);
    };
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root{
  --c-bg:#f9f7f4;--c-card:#ffffff;--c-surface:#faf7f0;--c-hover:#f0ece4;
  --c-border:#e0dbd2;--c-border-light:#e8e2d8;
  --c-text:#1a1814;--c-text2:#4a4540;--c-text3:#8a8278;
  --c-nav-bg:rgba(249,247,244,.96);--c-scroll:#dddddd;
}
.dark{
  --c-bg:#0d0b09;--c-card:#1a160d;--c-surface:#201a10;--c-hover:#2a2218;
  --c-border:#3a3020;--c-border-light:#2e2618;
  --c-text:#f0e8d8;--c-text2:#c8b898;--c-text3:#8a7a68;
  --c-nav-bg:rgba(13,11,9,.96);--c-scroll:#3a3020;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--c-bg)}
body{font-family:'Inter',sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;transition:background .2s,color .2s}
a{text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;color:inherit}

/* T&C nav — mirrors main site exactly */
#tc-nav{background:var(--c-nav-bg);backdrop-filter:blur(8px);border-bottom:0.5px solid var(--c-border-light);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:200}
.nh{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;color:var(--c-text);cursor:pointer;flex-shrink:0;text-decoration:none;display:inline-block}
.nh span{color:#c8881a;font-style:italic}
.nright{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nl{font-size:11px;color:var(--c-text3);letter-spacing:.04em;padding:4px 10px;border:0.5px solid var(--c-border);border-radius:20px;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:3px;background:none;cursor:pointer}
.nl:hover,.nl.active-nav{background:var(--c-hover);border-color:#c8881a;color:#8B6914}
.nav-rd{position:relative;display:inline-flex}
.nav-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--c-card);border:0.5px solid var(--c-border);border-radius:8px;padding:4px;min-width:140px;z-index:300;opacity:0;pointer-events:none;transform:translateY(-4px);transition:all .15s}
.nav-rd:hover .nav-drop,.nav-drop:hover{opacity:1;pointer-events:all;transform:translateY(0)}
.nav-di{display:block;font-size:11px;color:var(--c-text3);padding:7px 11px;border-radius:5px;text-decoration:none;transition:all .12s;letter-spacing:.03em;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:'Inter',sans-serif}
.nav-di:hover,.nav-di.active-section{background:var(--c-hover);color:var(--c-text)}
.nav-di.active-section{color:#8B6914;font-weight:500}
.n-theme{padding:4px 8px;line-height:1}

/* Research page header */
#research-header{max-width:760px;margin:0 auto;padding:28px 24px 20px;border-bottom:0.5px solid var(--c-border-light)}
.rh-eyebrow{font-size:9px;letter-spacing:.28em;color:#8B6914;font-weight:500;margin-bottom:10px}
.rh-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:var(--c-text);margin-bottom:6px}
.rh-sub{font-size:12px;color:var(--c-text3);line-height:1.7;max-width:560px}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-scroll);border-radius:2px}

/* React app container */
#root{min-height:calc(100vh - 120px)}

/* Blend React app into T&C design — suppress its internal sticky header
   so our nav takes precedence. The React app's header becomes a sub-nav. */
#root header, #root nav:first-child{
  position:static!important;
  top:auto!important;
  z-index:1!important;
  border-top:0.5px solid var(--c-border-light);
}
</style>
</head>
<body>

<!-- T&C Nav -->
<nav id="tc-nav">
  <a class="nh" href="/">TRUTH <span>&amp;</span> CONSEQUENCES</a>
  <div class="nright">
    <a class="nl" href="/">Home</a>
    <a class="nl" href="/?view=lib" id="nl-curr">Curriculum</a>
    <a class="nl" href="/?view=guide" id="nl-guide">Ask the Guide</a>
    <div class="nav-rd">
      <span class="nl active-nav" style="gap:4px">Research <span style="font-size:9px;opacity:.7">▾</span></span>
      <div class="nav-drop" id="rdrop">
        <button class="nav-di active-section" id="btn-overview" data-section="overview">Overview</button>
        <button class="nav-di" id="btn-mechanisms" data-section="mechanisms">Mechanisms</button>
        <button class="nav-di" id="btn-about" data-section="about">About</button>
      </div>
    </div>
    <button class="nl n-theme" id="n-theme" aria-label="Toggle theme"></button>
  </div>
</nav>

<!-- React app mounts here -->
<div id="root"></div>

<!-- React app assets -->
<script type="module" crossorigin src="./assets/index-igy7-JIS.js"></script>
<link rel="stylesheet" crossorigin href="./assets/index-nvX6hp1U.css"/>

<script>
const GOLD='#8B6914';
const MOON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SUN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

// Section → React button text mapping
const SECTION_MAP={
  overview:'Overview',
  mechanisms:'Mechanisms',
  about:'About'
};

// Active section state
let activeSection='overview';

function isDark(){return document.documentElement.classList.contains('dark');}

function updateThemeBtn(){
  const btn=document.getElementById('n-theme');
  if(!btn)return;
  const dark=isDark();
  btn.innerHTML=dark?SUN:MOON;
  btn.title=dark?'Switch to light mode':'Switch to dark mode';
}

function toggleTheme(){
  const d=document.documentElement;
  const nowDark=d.classList.toggle('dark');
  d.classList.toggle('light',!nowDark);
  localStorage.setItem('tc-theme',nowDark?'dark':'light');
  updateThemeBtn();
  // Sync with React app's theme by clicking its toggle button
  syncReactTheme(nowDark);
}

function syncReactTheme(wantDark){
  // Find React's theme toggle button (aria-label starts with "Switch to")
  const reactToggle=document.querySelector('#root button[aria-label^="Switch to"]');
  if(!reactToggle)return;
  const label=reactToggle.getAttribute('aria-label')||'';
  // Only click if React is in the wrong state
  // "Switch to dark mode" means React is currently light
  // "Switch to light mode" means React is currently dark
  const reactIsDark=label.includes('light'); // "Switch to light" = currently dark
  if(reactIsDark!==wantDark)reactToggle.click();
}

// Click a React section tab by matching text
function activateSection(section){
  activeSection=section;
  updateSectionHighlight();
  const label=SECTION_MAP[section];
  if(!label)return;
  // Find all buttons in the React app and click the matching one
  const allBtns=document.querySelectorAll('#root button');
  for(const btn of allBtns){
    const txt=(btn.textContent||'').trim();
    if(txt===label||txt.startsWith(label)){
      btn.click();
      break;
    }
  }
  // Update URL without reload
  const url=new URL(window.location.href);
  url.searchParams.set('s',section);
  window.history.replaceState({},'',url.toString());
}

function updateSectionHighlight(){
  document.querySelectorAll('.nav-di').forEach(b=>{
    b.classList.toggle('active-section',b.dataset.section===activeSection);
  });
}

// Wait for React to mount, then activate the requested section
function waitForReactAndActivate(section,attempt){
  attempt=attempt||0;
  if(attempt>80)return; // give up after ~4 seconds
  const root=document.getElementById('root');
  const hasContent=root&&root.children.length>0&&root.querySelector('button');
  if(hasContent){
    // Small additional delay to let React finish rendering tabs
    setTimeout(()=>activateSection(section),120);
  }else{
    setTimeout(()=>waitForReactAndActivate(section,attempt+1),50);
  }
}

// Parse section from URL on load
function getSectionFromURL(){
  const params=new URLSearchParams(window.location.search);
  const s=params.get('s');
  return(s&&SECTION_MAP[s])?s:'overview';
}

// Initialize
updateThemeBtn();

// Wire theme toggle
document.getElementById('n-theme').addEventListener('click',toggleTheme);

// Wire sub-nav section buttons
document.querySelectorAll('.nav-di[data-section]').forEach(btn=>{
  btn.addEventListener('click',function(e){
    e.preventDefault();
    activateSection(this.dataset.section);
  });
});

// After DOM ready, wait for React then activate section from URL
const targetSection=getSectionFromURL();
activeSection=targetSection;
updateSectionHighlight();

// Use both DOMContentLoaded and a delay to catch React mount
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>waitForReactAndActivate(targetSection));
}else{
  waitForReactAndActivate(targetSection);
}

// Also sync React theme after it mounts
function waitAndSyncTheme(attempt){
  attempt=attempt||0;
  if(attempt>80)return;
  const reactToggle=document.querySelector('#root button[aria-label^="Switch to"]');
  if(reactToggle){
    const dark=isDark();
    syncReactTheme(dark);
  }else{
    setTimeout(()=>waitAndSyncTheme(attempt+1),50);
  }
}
waitAndSyncTheme();
</script>

<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
